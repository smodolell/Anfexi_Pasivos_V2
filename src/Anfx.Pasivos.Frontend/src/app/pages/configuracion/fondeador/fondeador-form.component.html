<div class="container mt-4">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/configuracion/fondeador">Fondeadores</a></li>
      <li class="breadcrumb-item active">{{ isEditMode() ? 'Editar' : 'Nuevo' }}</li>
    </ol>
  </nav>

  <app-card
    [title]="isEditMode() ? 'Editar Fondeador' : 'Nuevo Fondeador'"
    [icon]="isEditMode() ? 'fa-solid fa-pen-clip' : 'fa-solid fa-building'"
    [variant]="isEditMode() ? 'warning' : 'info'">

    @if (errorMsg()) {
      <div class="alert alert-danger">{{ errorMsg() }}</div>
    }

    <form id="fondeadorFormEl" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="row g-3">

        <div class="col-md-8">
          <label for="fondeador" class="form-label fw-bold">Nombre del Fondeador <span class="text-danger">*</span></label>
          <input type="text" id="fondeador" formControlName="fondeador" class="form-control"
            [class.is-invalid]="isInvalid('fondeador')" placeholder="Ej: INFONAVIT" />
          <div class="invalid-feedback">El nombre es obligatorio (máx. 200 caracteres).</div>
        </div>

        <div class="col-md-4">
          <label for="claveCuentaContable" class="form-label fw-bold">Clave Cuenta Contable</label>
          <input type="text" id="claveCuentaContable" formControlName="claveCuentaContable" class="form-control"
            [class.is-invalid]="isInvalid('claveCuentaContable')" placeholder="Ej: 2100-001" />
          <div class="invalid-feedback">Máximo 50 caracteres.</div>
        </div>

      </div>
    </form>

    <div slot="footer" class="d-flex justify-content-end gap-2">
      <a routerLink="/configuracion/fondeador" class="btn btn-outline-secondary">
        <i class="fa fa-times me-1"></i> Cancelar
      </a>
      <button type="submit" form="fondeadorFormEl" class="btn btn-primary" [disabled]="form.invalid || isLoading()">
        @if (isLoading()) {
          <span class="spinner-border spinner-border-sm me-1"></span>
        }
        <i class="fa fa-save me-1"></i> {{ isEditMode() ? 'Guardar Cambios' : 'Registrar Fondeador' }}
      </button>
    </div>

  </app-card>
</div>
