<div class="container-fluid">
  <app-card [title]="'Fondeadores'" [icon]="'fa-solid fa-money-bill-wave'" variant="primary">
    <app-generic-table
      [columns]="columns"
      [items]="fondeadores()"
      [loading]="loading()"
      [actions]="actions"
      [totalCount]="totalCount()"
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      [pageSize]="pageSize()"
      [searchable]="true"
      [searchPlaceholder]="'Buscar fondeador...'"
      [searchValue]="query.q"
      [showNew]="true"
      (searchChanged)="onSearch($event)"
      (actionCalled)="onAction($event)"
      (pageNext)="nextPage()"
      (pagePrev)="prevPage()"
      (newClicked)="onNuevo()">
    </app-generic-table>
  </app-card>
</div>

<app-confirm-modal
  #confirmModal
  title="Confirmar eliminación"
  message="¿Está seguro que desea eliminar el fondeador?"
  [itemName]="fondeadorAEliminar?.titulo ?? undefined"
  (confirmed)="confirmarEliminacion()"
  (cancelled)="cancelarEliminacion()">
</app-confirm-modal>
