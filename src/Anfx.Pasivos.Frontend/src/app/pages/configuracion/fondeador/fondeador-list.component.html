<div class="container-fluid">
  <div class="row">
    <div class="col-12">

      <app-generic-table
        [columns]="columns"
        [items]="fondeadores()"
        [loading]="loading()"
        [actions]="actions"
        [totalCount]="totalCount()"
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [pageSize]="pageSize()"
        [searchable]="true"
        [searchPlaceholder]="'Buscar fondeador...'"
        [searchValue]="query.q"
        [showNew]="true"
        (searchChanged)="onSearch($event)"
        (actionCalled)="onAction($event)"
        (pageNext)="nextPage()"
        (pagePrev)="prevPage()"
        (newClicked)="onNuevo()">
      </app-generic-table>

    </div>
  </div>
</div>

<app-confirm-modal
  #confirmModal
  title="Confirmar eliminación"
  message="¿Está seguro que desea eliminar el fondeador?"
  [itemName]="fondeadorAEliminar?.titulo ?? undefined"
  (confirmed)="confirmarEliminacion()"
  (cancelled)="cancelarEliminacion()">
</app-confirm-modal>
