<div class="container mt-4">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/configuracion/tipo-tabla-amortiza">Tipos de Tabla Amortización</a></li>
      <li class="breadcrumb-item active">{{ isEditMode() ? 'Editar' : 'Nuevo' }}</li>
    </ol>
  </nav>

  <app-card
    [title]="isEditMode() ? 'Editar Tipo Tabla Amortización' : 'Nuevo Tipo Tabla Amortización'"
    [icon]="isEditMode() ? 'fa-solid fa-pen-clip' : 'fa-solid fa-table-list'"
    [variant]="isEditMode() ? 'warning' : 'info'">

    @if (errorMsg()) {
      <div class="alert alert-danger">{{ errorMsg() }}</div>
    }

    <form id="tipoTablaFormEl" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="row g-3">

        <div class="col-md-12">
          <label for="tipoTablaAmortiza" class="form-label fw-bold">Tipo Tabla Amortización <span class="text-danger">*</span></label>
          <input type="text" id="tipoTablaAmortiza" formControlName="tipoTablaAmortiza" class="form-control"
            [class.is-invalid]="isInvalid('tipoTablaAmortiza')" placeholder="Ej: Tabla Francesa" />
          <div class="invalid-feedback">Campo obligatorio (máx. 200 caracteres).</div>
        </div>

        <div class="col-md-6">
          <div class="form-check mt-2">
            <input type="checkbox" formControlName="esCapitalizable" class="form-check-input" id="esCapitalizableCheck" />
            <label class="form-check-label fw-bold" for="esCapitalizableCheck">Es Capitalizable</label>
          </div>
        </div>

        <div class="col-md-6">
          <div class="form-check mt-2">
            <input type="checkbox" formControlName="activo" class="form-check-input" id="activoCheck" />
            <label class="form-check-label fw-bold" for="activoCheck">Activo</label>
          </div>
        </div>

      </div>
    </form>

    <div slot="footer" class="d-flex justify-content-end gap-2">
      <a routerLink="/configuracion/tipo-tabla-amortiza" class="btn btn-outline-secondary">
        <i class="fa fa-times me-1"></i> Cancelar
      </a>
      <button type="submit" form="tipoTablaFormEl" class="btn btn-primary" [disabled]="form.invalid || isLoading()">
        @if (isLoading()) {
          <span class="spinner-border spinner-border-sm me-1"></span>
        }
        <i class="fa fa-save me-1"></i> {{ isEditMode() ? 'Guardar Cambios' : 'Registrar' }}
      </button>
    </div>

  </app-card>
</div>
