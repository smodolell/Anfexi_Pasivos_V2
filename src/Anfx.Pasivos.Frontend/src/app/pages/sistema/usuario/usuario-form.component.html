<app-card
  [title]="usuario.id ? 'Editar Usuario' : 'Nuevo Usuario'"
  [icon]="usuario.id ? 'fa-solid fa-user-pen' : 'fa-solid fa-user-plus'"
  [variant]="usuario.id ? 'warning' : 'info'">

  <form id="usuarioFormEl" [formGroup]="usuarioForm" (ngSubmit)="onSubmit()">

    <div class="row g-3">

      <div class="col-md-6">
        <app-form-field
          formControlName="nombreCompleto"
          label="Nombre Completo"
          placeholder="Ej: Juan Pérez"
          [required]="true">
        </app-form-field>
      </div>

      <div class="col-md-6">
        <app-form-field
          formControlName="usuarioNombre"
          label="Nombre de Usuario"
          placeholder="Ej: jperez"
          [required]="true">
        </app-form-field>
      </div>

      <div class="col-md-6">
        <app-form-field
          formControlName="email"
          label="Email"
          type="email"
          placeholder="Ej: jperez@empresa.com"
          [required]="true">
        </app-form-field>
      </div>

      <!-- Contraseña — solo en creación -->
      @if (!usuario.id) {
        <div class="col-md-6">
          <app-form-field
            formControlName="contrasenia"
            label="Contraseña"
            type="password"
            placeholder="Mínimo 8 caracteres"
            [required]="true">
          </app-form-field>
        </div>
        <div class="offset-md-6 col-md-6">
          <app-form-field
            formControlName="confirma_contrasenia"
            label="Confirmar Contraseña"
            type="password"
            placeholder="Repite la contraseña"
            [required]="true">
          </app-form-field>
        </div>
      }

    </div>

    <!-- Edición de contraseña — solo en modo edición -->
    @if (usuario.id) {
      <div class="row g-3 mt-1">

        <div class="col-md-6">
          <p class="form-label fw-bold mb-1">Edita Contraseña</p>
          <app-form-check
            formControlName="permiteEditarContrasenia"
            label="Permitir al usuario cambiar su contraseña">
          </app-form-check>
        </div>

        @if (usuarioForm.get('permiteEditarContrasenia')?.value) {
          <div class="col-md-6">
            <app-form-field
              formControlName="contrasenia"
              label="Nueva Contraseña"
              type="password"
              placeholder="Mínimo 8 caracteres"
              [required]="true">
            </app-form-field>
          </div>
          <div class="offset-md-6 col-md-6">
            <app-form-field
              formControlName="confirma_contrasenia"
              label="Confirmar Nueva Contraseña"
              type="password"
              placeholder="Repite la nueva contraseña"
              [required]="true">
            </app-form-field>
          </div>
        }

      </div>
    }

    <div class="row g-3 mt-1">

      <div class="col-md-6">
        <div class="mb-0">
          <label for="rolId" class="form-label fw-bold">
            Rol <span class="text-danger" aria-hidden="true">*</span>
          </label>
          <select id="rolId" formControlName="rolId"
            class="form-control form-select" [class.is-invalid]="isFieldInvalid('rolId')">
            <option [ngValue]="undefined">
              {{ loadingRoles() ? 'Cargando roles...' : '[ SELECCIONE ]' }}
            </option>
            @for (role of roles(); track role.value) {
              <option [ngValue]="role.value">{{ role.text }}</option>
            }
          </select>
          @if (isFieldInvalid('rolId')) {
            <div class="invalid-feedback">{{ getFieldError('rolId') }}</div>
          }
        </div>
      </div>

      <div class="col-md-6">
        <p class="form-label fw-bold mb-1">Estado</p>
        <app-form-check
          formControlName="activo"
          mode="switch"
          trueLabel="Activo"
          falseLabel="Inactivo">
        </app-form-check>
      </div>

    </div>

  </form>

  <div slot="footer" class="d-flex justify-content-end gap-2">
    <button type="button" class="btn btn-outline-secondary" (click)="onCancel()">
      <i class="fa fa-times me-1"></i> Cancelar
    </button>
    <button type="submit" form="usuarioFormEl" class="btn btn-primary"
      [disabled]="usuarioForm.invalid">
      <i class="fa fa-save me-1"></i> Guardar
    </button>
  </div>

</app-card>
