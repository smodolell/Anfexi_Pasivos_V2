<div class="card">
  <div class="card-body">

    @if (!mostrandoFormulario()) {
      <h1 class="page-title">Usuarios</h1>

      <app-generic-table
        [columns]="columns"
        [items]="ds.items()"
        [loading]="ds.loading()"
        [actions]="actions"
        [totalCount]="ds.totalCount()"
        [currentPage]="ds.currentPage()"
        [totalPages]="ds.totalPages()"
        [pageSize]="ds.pageSize()"
        [sortColumn]="ds.sortColumn()"
        [sortDirection]="ds.sortDirection()"
        [showNew]="true"
        (actionCalled)="onAction($event)"
        (searchChanged)="onSearch($event)"
        (sortChanged)="onSort($event)"
        (pageNext)="onPageNext()"
        (pagePrev)="onPagePrev()"
        (newClicked)="onNuevo()"
        [searchable]="true"
        [searchPlaceholder]="'Buscar usuarios...'"
        >

        <app-filter-activo
          slot="filters"
          label="Solo activos"
          [value]="ds.activo()"
          (changed)="onActivoChange($event)">
        </app-filter-activo>

      </app-generic-table>
    }

    @if (mostrandoFormulario()) {
      <app-usuario-form
        [usuario]="usuarioSeleccionado"
        [isFromProfile]="false"
        (guardar)="onGuardarUsuario($event)"
        (cancelar)="onCancelarEdicion()"
        (volverALista)="volverALista()">
      </app-usuario-form>
    }

  </div>

  <app-confirm-modal
    #confirmModal
    title="Confirmar eliminación"
    message="¿Está seguro que desea eliminar el usuario?"
    [itemName]="usuarioAEliminar?.nombreCompleto"
    (confirmed)="confirmarEliminacion()"
    (cancelled)="cancelarEliminacion()">
  </app-confirm-modal>
</div>
