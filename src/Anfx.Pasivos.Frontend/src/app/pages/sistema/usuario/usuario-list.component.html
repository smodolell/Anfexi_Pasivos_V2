<div class="container-fluid">
  @if (!mostrandoFormulario()) {
    <app-card [title]="'Usuarios'" [icon]="'fa-solid fa-users'" variant="primary">
      <app-generic-table
        [columns]="columns"
        [actions]="actions"
        [items]="items()"
        [loading]="loading()"
        [totalCount]="totalCount()"
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [pageSize]="pageSize()"
        [showNew]="true"
        (actionCalled)="onAction($event)"
        (searchChanged)="onSearch($event)"
        (pageNext)="onPageNext()"
        (pagePrev)="onPagePrev()"
        (newClicked)="onNuevo()">

        <app-filter-activo
          slot="filters"
          label="Solo activos"
          [(value)]="query.activo"
          (changed)="onActivoChange()">
        </app-filter-activo>

      </app-generic-table>
    </app-card>
  } @else {
    <app-usuario-form
      [usuario]="usuarioSeleccionado"
      [isFromProfile]="false"
      (guardar)="onGuardarUsuario($event)"
      (cancelar)="onCancelarEdicion()"
      (volverALista)="volverALista()">
    </app-usuario-form>
  }
</div>

<app-confirm-modal
  #confirmModal
  title="Confirmar eliminación"
  message="¿Está seguro que desea eliminar el usuario?"
  [itemName]="usuarioAEliminar?.nombreCompleto"
  (confirmed)="confirmarEliminacion()"
  (cancelled)="cancelarEliminacion()">
</app-confirm-modal>
