<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">

          @if (mostrandoFormulario()) {
            <div class="mb-3 d-flex justify-content-between align-items-center">
              <h4 class="card-title mb-0">
                {{ usuarioSeleccionado.id ? 'Editar Usuario' : 'Nuevo Usuario' }}
              </h4>
              <button class="btn btn-outline-secondary btn-sm" (click)="volverALista()">
                <i class="fa-solid fa-arrow-left me-1"></i> Volver
              </button>
            </div>
            <app-usuario-form
              [usuario]="usuarioSeleccionado"
              [isFromProfile]="false"
              (guardar)="onGuardarUsuario($event)"
              (cancelar)="onCancelarEdicion()"
              (volverALista)="volverALista()">
            </app-usuario-form>
          }

          @if (!mostrandoFormulario()) {
            <!-- Filtro extra: activo (fuera del generic-table) -->
            <div class="d-flex align-items-center gap-3 mb-2">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="filtroActivo"
                  [(ngModel)]="query.activo" (change)="onActivoChange()">
                <label class="form-check-label" for="filtroActivo">Solo activos</label>
              </div>
            </div>

            <app-generic-table
              [columns]="columns"
              [actions]="actions"
              [items]="items()"
              [loading]="loading()"
              [totalCount]="totalCount()"
              [currentPage]="currentPage()"
              [totalPages]="totalPages()"
              [pageSize]="pageSize()"
              [showNew]="true"
              (actionCalled)="onAction($event)"
              (searchChanged)="onSearch($event)"
              (pageNext)="onPageNext()"
              (pagePrev)="onPagePrev()"
              (newClicked)="onNuevo()">
            </app-generic-table>
          }

        </div>

        <!-- Modal eliminación -->
        <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">Confirmar eliminación</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <p>¿Eliminar al usuario <strong>{{ usuarioAEliminar?.nombreCompleto }}</strong>?</p>
                <p class="text-muted small">Esta acción no se puede deshacer.</p>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" (click)="cancelarEliminacion()">Cancelar</button>
                <button type="button" class="btn btn-danger" (click)="confirmarEliminacion()">
                  <i class="fa-solid fa-user-minus me-1"></i> Eliminar
                </button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
