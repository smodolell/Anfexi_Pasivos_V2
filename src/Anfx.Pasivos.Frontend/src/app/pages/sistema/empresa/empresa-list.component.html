<div class="container-fluid">
  <div class="row">
    <div class="col-12">

      @if (!mostrandoFormulario()) {
        <app-generic-table
          [columns]="columns"
          [items]="items()"
          [loading]="loading()"
          [actions]="actions"
          [totalCount]="totalCount()"
          [currentPage]="currentPage()"
          [totalPages]="totalPages()"
          [pageSize]="pageSize()"
          [sortColumn]="sortColumn"
          [sortDirection]="sortDirection"
          [searchable]="true"
          [searchPlaceholder]="'Buscar empresa...'"
          [searchValue]="searchValue"
          [showNew]="true"
          [showExport]="false"
          (searchChanged)="onSearch($event)"
          (sortChanged)="onSort($event)"
          (actionCalled)="onAction($event)"
          (pageNext)="nextPage()"
          (pagePrev)="prevPage()"
          (newClicked)="onNuevo()"
        />
      } @else {
        <div class="card">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h4 class="card-title mb-0">
                {{ empresaSeleccionada.id ? 'Editar Empresa' : 'Nueva Empresa' }}
              </h4>
              <button class="btn btn-secondary btn-sm" (click)="volverALista()">
                <i class="ti-arrow-left me-1"></i> Volver a la lista
              </button>
            </div>
            <app-empresa-form
              [empresa]="empresaSeleccionada"
              (guardar)="onGuardarEmpresa($event)"
              (cancelar)="onCancelarEdicion()"
              (volverALista)="volverALista()"
            />
          </div>
        </div>
      }

    </div>
  </div>
</div>

<app-confirm-modal
  #confirmModal
  title="Confirmar eliminación"
  message="¿Está seguro que desea eliminar la empresa?"
  [itemName]="empresaAEliminar?.sEmpresa"
  (confirmed)="confirmarEliminacion()"
  (cancelled)="cancelarEliminacion()"
/>
