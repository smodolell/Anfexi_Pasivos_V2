<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">

          @if (mostrandoFormulario()) {
            <div class="mb-3 d-flex justify-content-between align-items-center">
              <h4 class="card-title mb-0">
                {{ rolSeleccionado.id ? 'Editar Rol' : 'Nuevo Rol' }}
              </h4>
              <button class="btn btn-outline-secondary btn-sm" (click)="volverALista()">
                <i class="fa-solid fa-arrow-left me-1"></i> Volver
              </button>
            </div>
            <app-rol-form
              [rol]="rolSeleccionado"
              (guardar)="onGuardarRol($event)"
              (cancelar)="onCancelarEdicion()"
              (volverALista)="volverALista()">
            </app-rol-form>
          }

          @if (!mostrandoFormulario()) {
            <app-generic-table
              [columns]="columns"
              [actions]="actions"
              [items]="items()"
              [loading]="loading()"
              [totalCount]="totalCount()"
              [currentPage]="currentPage()"
              [totalPages]="totalPages()"
              [pageSize]="pageSize()"
              [showNew]="true"
              (actionCalled)="onAction($event)"
              (searchChanged)="onSearch($event)"
              (pageNext)="onPageNext()"
              (pagePrev)="onPagePrev()"
              (newClicked)="onNuevo()">
            </app-generic-table>
          }

        </div>

        <!-- Modal eliminación -->
        <div class="modal fade" id="confirmDeleteRolModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">Confirmar eliminación</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <p>¿Eliminar el rol <strong>{{ rolAEliminar?.sRol }}</strong>?</p>
                <p class="text-muted small">Esta acción no se puede deshacer.</p>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" (click)="cancelarEliminacion()">Cancelar</button>
                <button type="button" class="btn btn-danger" (click)="confirmarEliminacion()">
                  <i class="fa-solid fa-trash-can me-1"></i> Eliminar
                </button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
