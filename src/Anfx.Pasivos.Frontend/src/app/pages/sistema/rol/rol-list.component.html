<div class="card">
  <div class="card-body">

    @if (!mostrandoFormulario()) {
      <h1 class="page-title">Roles</h1>

      <app-generic-table
        [columns]="columns"
        [actions]="actions"
        [items]="items()"
        [loading]="loading()"
        [totalCount]="totalCount()"
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [pageSize]="pageSize()"
        [showNew]="true"
        (actionCalled)="onAction($event)"
        (searchChanged)="onSearch($event)"
        (pageNext)="onPageNext()"
        (pagePrev)="onPagePrev()"
        (newClicked)="onNuevo()"
      >
      </app-generic-table>
    }

    @if (mostrandoFormulario()) {
      <app-rol-form
        [rol]="rolSeleccionado"
        (guardar)="onGuardarRol($event)"
        (cancelar)="onCancelarEdicion()"
        (volverALista)="volverALista()">
      </app-rol-form>
    }

  </div>

  <app-confirm-modal
    #confirmModal
    title="Confirmar eliminación"
    message="¿Está seguro que desea eliminar el rol?"
    [itemName]="rolAEliminar?.sRol"
    (confirmed)="confirmarEliminacion()"
    (cancelled)="cancelarEliminacion()"
  >
  </app-confirm-modal>
</div>
