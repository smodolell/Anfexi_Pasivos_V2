<div class="container mt-4 pb-5">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb mb-4">
      <li class="breadcrumb-item"><a routerLink="/catalogos/estatus-contrato">Estatus de Contrato</a></li>
      <li class="breadcrumb-item active">{{ isEditMode() ? 'Editar' : 'Nuevo' }}</li>
    </ol>
  </nav>

  <app-card
    [title]="isEditMode() ? 'Actualizar Estatus de Contrato' : 'Registrar Nuevo Estatus de Contrato'"
    [icon]="isEditMode() ? 'fa-solid fa-pen-clip' : 'fa-solid fa-file-circle-check'"
    [variant]="isEditMode() ? 'warning' : 'info'">

    <form id="estatusFormEl" [formGroup]="estatusForm" (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-md-12 mb-3">
          <label for="estatusContrato" class="form-label fw-bold">Nombre del Estatus <span class="text-danger">*</span></label>
          <input type="text" id="estatusContrato" formControlName="estatusContrato" class="form-control"
            [class.is-invalid]="isInvalid('estatusContrato')"
            placeholder="Ej: Activo, Cancelado, Pendiente...">
          <div class="invalid-feedback">El nombre del estatus es obligatorio.</div>
        </div>
      </div>
    </form>

    <div slot="footer" class="d-flex justify-content-end gap-2">
      <a routerLink="/catalogos/estatus-contrato" class="btn btn-outline-secondary">
        <i class="fa fa-times me-1"></i> Cancelar
      </a>
      <button type="submit" form="estatusFormEl" class="btn btn-primary" [disabled]="estatusForm.invalid || isLoading()">
        @if (isLoading()) {
          <span class="spinner-border spinner-border-sm me-1"></span>
        }
        <i class="fa fa-save me-1"></i> {{ isEditMode() ? 'Guardar Cambios' : 'Registrar Estatus' }}
      </button>
    </div>

  </app-card>
</div>
