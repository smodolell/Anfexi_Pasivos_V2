<div class="container-fluid">
  <app-card [title]="'Cuentas Bancarias'" [icon]="'fa-solid fa-credit-card'" variant="primary">
    <app-generic-table
      [columns]="columns"
      [items]="items()"
      [loading]="loading()"
      [actions]="actions"
      [totalCount]="totalCount()"
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      [pageSize]="pageSize()"
      [sortColumn]="sortColumn"
      [sortDirection]="sortDirection"
      [searchable]="true"
      [searchPlaceholder]="'Buscar por banco o cuenta...'"
      [searchValue]="searchValue"
      [showNew]="true"
      [showExport]="false"
      (searchChanged)="onSearch($event)"
      (sortChanged)="onSort($event)"
      (actionCalled)="onAction($event)"
      (pageNext)="nextPage()"
      (pagePrev)="prevPage()"
      (newClicked)="onNuevo()"
    />
  </app-card>
</div>
