<div class="container mt-4 pb-5">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb mb-4">
      <li class="breadcrumb-item"><a routerLink="/catalogos/cuentas-bancarias">Cuentas Bancarias</a></li>
      <li class="breadcrumb-item active">{{ isEditMode() ? 'Editar' : 'Nueva' }}</li>
    </ol>
  </nav>

  <app-card
    [title]="isEditMode() ? 'Actualizar Cuenta Bancaria' : 'Registrar Nueva Cuenta Bancaria'"
    [icon]="isEditMode() ? 'fa-solid fa-pen-clip' : 'fa-solid fa-money-check-dollar'"
    [variant]="isEditMode() ? 'warning' : 'info'">

    <form id="cuentaFormEl" [formGroup]="cuentaForm" (ngSubmit)="onSubmit()">
      <div class="row g-3">
        <div class="col-md-6">
          <label for="idBanco" class="form-label fw-bold">Banco <span class="text-danger">*</span></label>
          <select id="idBanco" formControlName="idBanco" class="form-select" [class.is-invalid]="isInvalid('idBanco')">
            <option [ngValue]="null">Seleccione un banco...</option>
            @for (banco of bancos(); track banco.id) {
              <option [ngValue]="banco.id">{{ banco.banco }}</option>
            }
          </select>
          <div class="invalid-feedback">Debe seleccionar un banco.</div>
        </div>

        <div class="col-md-6">
          <label for="cuentaBancaria" class="form-label fw-bold">Número de Cuenta <span class="text-danger">*</span></label>
          <input type="text" id="cuentaBancaria" formControlName="cuentaBancaria" class="form-control" [class.is-invalid]="isInvalid('cuentaBancaria')" placeholder="Máximo 20 dígitos">
          <div class="invalid-feedback">La cuenta bancaria es obligatoria.</div>
        </div>

        <div class="col-md-6">
          <label for="clabe" class="form-label fw-bold">CLABE <span class="text-danger">*</span></label>
          <input type="text" id="clabe" formControlName="clabe" class="form-control" [class.is-invalid]="isInvalid('clabe')" placeholder="18 dígitos">
          <div class="invalid-feedback">La CLABE debe tener exactamente 18 dígitos.</div>
        </div>
      </div>
    </form>

    <div slot="footer" class="d-flex justify-content-end gap-2">
      <a routerLink="/catalogos/cuentas-bancarias" class="btn btn-outline-secondary">
        <i class="fa fa-times me-1"></i> Cancelar
      </a>
      <button type="submit" form="cuentaFormEl" class="btn btn-primary" [disabled]="cuentaForm.invalid || isLoading()">
        @if (isLoading()) {
          <span class="spinner-border spinner-border-sm me-1"></span>
        }
        <i class="fa fa-save me-1"></i> {{ isEditMode() ? 'Guardar Cambios' : 'Registrar Cuenta' }}
      </button>
    </div>

  </app-card>
</div>
