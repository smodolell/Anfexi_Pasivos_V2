<div class="row">
  <div class="col-md-8 offset-md-2">
    <app-card
      [title]="colonia.id ? 'Editar Colonia' : 'Nueva Colonia'"
      [icon]="colonia.id ? 'fa-solid fa-pen-clip' : 'fa-solid fa-map-location-dot'"
      [variant]="colonia.id ? 'warning' : 'info'">

      <form [formGroup]="coloniaForm" (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="sColonia" class="form-label">Colonia *</label>
            <input type="text"
              class="form-control"
              id="sColonia"
              formControlName="sColonia"
              [ngClass]="{'is-invalid': isFieldInvalid('sColonia')}"
              placeholder="Ingrese el nombre de la colonia">
            @if (isFieldInvalid('sColonia')) {
              <div class="invalid-feedback">{{ getFieldError('sColonia') }}</div>
            }
          </div>

          <div class="col-md-6 mb-3">
            <label for="estado" class="form-label">Estado *</label>
            <input type="text"
              class="form-control"
              id="estado"
              formControlName="estado"
              [ngClass]="{'is-invalid': isFieldInvalid('estado')}"
              placeholder="Ingrese el nombre del estado">
            @if (isFieldInvalid('estado')) {
              <div class="invalid-feedback">{{ getFieldError('estado') }}</div>
            }
          </div>

          <div class="col-md-6 mb-3">
            <label for="municipio" class="form-label">Municipio *</label>
            <input type="text"
              class="form-control"
              id="municipio"
              formControlName="municipio"
              [ngClass]="{'is-invalid': isFieldInvalid('municipio')}"
              placeholder="Ingrese el nombre del municipio">
            @if (isFieldInvalid('municipio')) {
              <div class="invalid-feedback">{{ getFieldError('municipio') }}</div>
            }
          </div>

          <div class="col-md-6 mb-3">
            <label for="codigoPostal" class="form-label">Código Postal *</label>
            <input type="text"
              class="form-control"
              id="codigoPostal"
              formControlName="codigoPostal"
              [ngClass]="{'is-invalid': isFieldInvalid('codigoPostal')}"
              placeholder="Ingrese el código postal (5 dígitos)"
              maxlength="5">
            @if (isFieldInvalid('codigoPostal')) {
              <div class="invalid-feedback">{{ getFieldError('codigoPostal') }}</div>
            }
          </div>
        </div>
      </form>

      <div slot="footer" class="d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-outline-secondary" (click)="onCancel()">
          <i class="fa fa-times me-1"></i> Cancelar
        </button>
        <button type="button" class="btn btn-primary" [disabled]="coloniaForm.invalid" (click)="onSubmit()">
          <i class="fa fa-save me-1"></i> Guardar
        </button>
      </div>

    </app-card>
  </div>
</div>
