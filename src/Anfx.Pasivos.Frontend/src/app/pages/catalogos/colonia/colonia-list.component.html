<div class="card">
  <div class="card-body">

    @if (!mostrandoFormulario()) {
      <h1 class="page-title">Colonias</h1>

      <app-generic-table
        [columns]="columns"
        [items]="items()"
        [loading]="loading()"
        [actions]="actions"
        [totalCount]="totalCount()"
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [pageSize]="pageSize()"
        [searchable]="true"
        [searchPlaceholder]="'Buscar colonia, estado, municipio...'"
        [searchValue]="query.q ?? ''"
        [showNew]="true"
        [showExport]="true"
        [exportLoading]="exportLoading()"
        [sortColumn]="sortColumn"
        [sortDirection]="sortDirection"
        (searchChanged)="onSearch($event)"
        (sortChanged)="onSort($event)"
        (actionCalled)="onAction($event)"
        (pageNext)="nextPage()"
        (pagePrev)="prevPage()"
        (newClicked)="mostrarFormularioNuevo()"
        (exportClicked)="onExportar()"
      />
    }

    @if (mostrandoFormulario()) {
      <app-colonia-form
        [colonia]="coloniaSeleccionada"
        (guardar)="onGuardarColonia($event)"
        (cancelar)="onCancelarEdicion()"
        (volverALista)="volverALista()"
      />
    }

  </div>

  <app-confirm-modal
    #confirmModal
    title="Confirmar eliminación"
    message="¿Está seguro que desea eliminar la colonia?"
    [itemName]="coloniaAEliminar?.sColonia"
    (confirmed)="confirmarEliminacion()"
    (cancelled)="cancelarEliminacion()">
  </app-confirm-modal>
</div>
