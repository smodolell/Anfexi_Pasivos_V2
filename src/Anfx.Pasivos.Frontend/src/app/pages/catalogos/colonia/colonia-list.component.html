<div class="container-fluid">
  <div class="row">
    <div class="col-12">

      @if (!mostrandoFormulario()) {

        <!-- Tabla genérica -->
        <app-generic-table
          [columns]="columns"
          [items]="items()"
          [loading]="loading()"
          [actions]="actions"
          [totalCount]="totalCount()"
          [currentPage]="currentPage()"
          [totalPages]="totalPages()"
          [pageSize]="pageSize()"
          [searchable]="true"
          [searchPlaceholder]="'Buscar colonia, estado, municipio...'"
          [searchValue]="query.q ?? ''"
          [showNew]="true"
          [showExport]="true"
          [exportLoading]="loading()"
          [sortColumn]="sortColumn"
          [sortDirection]="sortDirection"
          (searchChanged)="onSearch($event)"
          (sortChanged)="onSort($event)"
          (actionCalled)="onAction($event)"
          (pageNext)="nextPage()"
          (pagePrev)="prevPage()"
          (newClicked)="mostrarFormularioNuevo()"
          (exportClicked)="onExportar()"
        />

      } @else {

        <!-- Barra de regreso -->
        <div class="card">
          <div class="card-body">
            <div class="mb-3 text-end">
              <button class="btn btn-secondary" (click)="volverALista()">
                <i class="fa-solid fa-arrow-left"></i> Volver a la Lista
              </button>
            </div>

            <app-colonia-form
              [colonia]="coloniaSeleccionada"
              (guardar)="onGuardarColonia($event)"
              (cancelar)="onCancelarEdicion()"
              (volverALista)="volverALista()">
            </app-colonia-form>
          </div>
        </div>

      }

    </div>
  </div>
</div>

<!-- Modal confirmación de eliminación -->
<div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmDeleteModalLabel">Confirmar Eliminación</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <p>¿Está seguro que desea eliminar la colonia <strong>{{ coloniaAEliminar?.sColonia }}</strong>?</p>
        <p class="text-danger"><i class="fa-solid fa-triangle-exclamation"></i> Esta acción no se puede deshacer.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="cancelarEliminacion()">Cancelar</button>
        <button type="button" class="btn btn-danger" (click)="confirmarEliminacion()">
          <i class="fa-solid fa-trash"></i> Eliminar
        </button>
      </div>
    </div>
  </div>
</div>
