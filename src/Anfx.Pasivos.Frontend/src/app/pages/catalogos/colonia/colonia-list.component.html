<div class="container-fluid">
  <div class="row">
    <div class="col-12">

      @if (!mostrandoFormulario()) {

        <!-- Tabla genérica -->
        <app-generic-table
          [columns]="columns"
          [items]="items()"
          [loading]="loading()"
          [actions]="actions"
          [totalCount]="totalCount()"
          [currentPage]="currentPage()"
          [totalPages]="totalPages()"
          [pageSize]="pageSize()"
          [searchable]="true"
          [searchPlaceholder]="'Buscar colonia, estado, municipio...'"
          [searchValue]="query.q ?? ''"
          [showNew]="true"
          [showExport]="true"
          [exportLoading]="exportLoading()"
          [sortColumn]="sortColumn"
          [sortDirection]="sortDirection"
          (searchChanged)="onSearch($event)"
          (sortChanged)="onSort($event)"
          (actionCalled)="onAction($event)"
          (pageNext)="nextPage()"
          (pagePrev)="prevPage()"
          (newClicked)="mostrarFormularioNuevo()"
          (exportClicked)="onExportar()"
        />

      } @else {

        <!-- Barra de regreso -->
        <div class="card">
          <div class="card-body">
            <div class="mb-3 text-end">
              <button class="btn btn-secondary" (click)="volverALista()">
                <i class="fa-solid fa-arrow-left"></i> Volver a la Lista
              </button>
            </div>

            <app-colonia-form
              [colonia]="coloniaSeleccionada"
              (guardar)="onGuardarColonia($event)"
              (cancelar)="onCancelarEdicion()"
              (volverALista)="volverALista()">
            </app-colonia-form>
          </div>
        </div>

      }

    </div>
  </div>
</div>

<app-confirm-modal
  #confirmModal
  title="Confirmar eliminación"
  message="¿Está seguro que desea eliminar la colonia?"
  [itemName]="coloniaAEliminar?.sColonia"
  (confirmed)="confirmarEliminacion()"
  (cancelled)="cancelarEliminacion()">
</app-confirm-modal>
