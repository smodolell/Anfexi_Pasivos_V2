<div class="container-fluid">
  <div class="row">
    <div class="col-12">

      @if (!mostrandoFormulario()) {
        <app-generic-table
          [columns]="columns"
          [items]="items()"
          [loading]="loading()"
          [actions]="actions"
          [totalCount]="totalCount()"
          [currentPage]="currentPage()"
          [totalPages]="totalPages()"
          [pageSize]="pageSize()"
          [sortColumn]="sortColumn"
          [sortDirection]="sortDirection"
          [searchable]="true"
          [searchPlaceholder]="'Buscar tipo de pago...'"
          [searchValue]="searchValue"
          [showNew]="true"
          [showExport]="false"
          (searchChanged)="onSearch($event)"
          (sortChanged)="onSort($event)"
          (actionCalled)="onAction($event)"
          (pageNext)="nextPage()"
          (pagePrev)="prevPage()"
          (newClicked)="onNuevo()"
        />
      } @else {
        <app-tipo-pago-form
          [tipoPago]="tipoPagoSeleccionado"
          (guardar)="onGuardar($event)"
          (cancelar)="onCancelar()"
        />
      }

    </div>
  </div>
</div>

<app-confirm-modal
  #confirmModal
  title="Confirmar eliminación"
  message="¿Está seguro que desea eliminar el tipo de pago?"
  [itemName]="tipoPagoAEliminar?.tipoPago"
  (confirmed)="confirmarEliminacion()"
  (cancelled)="cancelarEliminacion()"
/>
