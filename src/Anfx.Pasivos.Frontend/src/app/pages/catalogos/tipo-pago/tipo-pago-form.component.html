<div class="row">
  <div class="col-md-6 offset-md-3">
    <app-card
      [title]="tipoPago.id ? 'Editar Tipo de Pago' : 'Nuevo Tipo de Pago'"
      [icon]="tipoPago.id ? 'fa-solid fa-pen-clip' : 'fa-solid fa-money-bill-wave'"
      [variant]="tipoPago.id ? 'warning' : 'info'">

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="tipoPago" class="form-label">Tipo de Pago *</label>
          <input
            type="text"
            class="form-control"
            id="tipoPago"
            formControlName="tipoPago"
            [ngClass]="{'is-invalid': isInvalid('tipoPago')}"
            placeholder="Ingrese el tipo de pago">
          @if (isInvalid('tipoPago')) {
            <div class="invalid-feedback">{{ getError('tipoPago') }}</div>
          }
        </div>
      </form>

      <div slot="footer" class="d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-outline-secondary" (click)="cancelar.emit()">
          <i class="fa fa-times me-1"></i> Cancelar
        </button>
        <button type="button" class="btn btn-primary" [disabled]="form.invalid" (click)="onSubmit()">
          <i class="fa fa-save me-1"></i> Guardar
        </button>
      </div>

    </app-card>
  </div>
</div>
