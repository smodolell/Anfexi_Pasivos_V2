<div class="row">
  <div class="col-md-6 offset-md-3">
    <app-card
      [title]="tipoDireccion.id ? 'Editar Tipo de Dirección' : 'Nuevo Tipo de Dirección'"
      [icon]="tipoDireccion.id ? 'fa-solid fa-pen-clip' : 'fa-solid fa-location-dot'"
      [variant]="tipoDireccion.id ? 'warning' : 'info'">

      <form [formGroup]="tipoDireccionForm" (ngSubmit)="onSubmit()">
        <div class="col-md-12 mb-3">
          <label for="sTipoDireccion" class="form-label">Título *</label>
          <input type="text"
            class="form-control"
            id="sTipoDireccion"
            formControlName="sTipoDireccion"
            [ngClass]="{'is-invalid': isFieldInvalid('sTipoDireccion')}"
            placeholder="Ingrese el título del tipo de dirección">
          @if (isFieldInvalid('sTipoDireccion')) {
            <div class="invalid-feedback">{{ getFieldError('sTipoDireccion') }}</div>
          }
        </div>
      </form>

      <div slot="footer" class="d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-outline-secondary" (click)="onCancel()">
          <i class="fa fa-times me-1"></i> Cancelar
        </button>
        <button type="button" class="btn btn-primary" [disabled]="tipoDireccionForm.invalid" (click)="onSubmit()">
          <i class="fa fa-save me-1"></i> Guardar
        </button>
      </div>

    </app-card>
  </div>
</div>
