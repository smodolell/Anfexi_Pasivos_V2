<div class="card">
  <div class="card-body">

    @if (!mostrandoFormulario()) {
      <h1 class="page-title">Tipos de Dirección</h1>

      <app-generic-table
        [columns]="columns"
        [items]="ds.items()"
        [loading]="ds.loading()"
        [currentPage]="ds.currentPage()"
        [totalPages]="ds.totalPages()"
        [totalCount]="ds.totalCount()"
        [pageSize]="ds.pageSize()"
        [searchValue]="ds.searchValue()"
        [sortColumn]="ds.sortColumn()"
        [sortDirection]="ds.sortDirection()"
        [actions]="actions"
        [searchable]="true"
        [searchPlaceholder]="'Buscar tipo de dirección...'"
        [showNew]="true"
        [showExport]="true"
        (searchChanged)="onSearch($event)"
        (sortChanged)="onSort($event)"
        (actionCalled)="onAction($event)"
        (pageNext)="nextPage()"
        (pagePrev)="prevPage()"
        (newClicked)="onNuevo()"
        (exportClicked)="onExportar()"
      />
    }

    @if (mostrandoFormulario()) {
      <app-tipodireccion-form
        [tipoDireccion]="tipoDireccionSeleccionado"
        (guardar)="onGuardarTipoDireccion($event)"
        (cancelar)="onCancelarEdicion()"
        (volverALista)="volverAlListado()"
      />
    }

  </div>

  <app-confirm-modal
    #confirmModal
    title="Confirmar eliminación"
    message="¿Está seguro que desea eliminar el tipo de dirección?"
    [itemName]="tipoDireccionAEliminar?.sTipoDireccion"
    (confirmed)="confirmarEliminacion()"
    (cancelled)="cancelarEliminacion()"
  />
</div>
