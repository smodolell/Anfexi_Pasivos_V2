<div class="container-fluid">
  <div class="row">
    <div class="col-12">

      <app-generic-table
        [columns]="columns"
        [items]="items()"
        [loading]="loading()"
        [actions]="actions"
        [totalCount]="totalCount()"
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [pageSize]="pageSize()"
        [sortColumn]="sortColumn"
        [sortDirection]="sortDirection"
        [searchable]="true"
        [searchPlaceholder]="'Buscar banco...'"
        [searchValue]="searchValue"
        [showNew]="true"
        [showExport]="false"
        (searchChanged)="onSearch($event)"
        (sortChanged)="onSort($event)"
        (actionCalled)="onAction($event)"
        (pageNext)="nextPage()"
        (pagePrev)="prevPage()"
        (newClicked)="onNuevo()"
      />

    </div>
  </div>
</div>

<app-confirm-modal
  #confirmModal
  [itemName]="bancoToDelete?.banco ?? undefined"
  (confirmed)="confirmDelete()"
  (cancelled)="bancoToDelete = null"
/>
