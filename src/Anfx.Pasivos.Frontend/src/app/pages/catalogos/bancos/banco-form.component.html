<div class="container mt-4">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/catalogos/bancos">Bancos</a></li>
      <li class="breadcrumb-item active">{{ isEditMode() ? 'Editar' : 'Nuevo' }}</li>
    </ol>
  </nav>

  <app-card
    [title]="isEditMode() ? 'Editar Banco' : 'Nuevo Banco'"
    [icon]="isEditMode() ? 'fa-solid fa-pen-clip' : 'fa-solid fa-building-columns'"
    [variant]="isEditMode() ? 'warning' : 'info'">

    <form id="bancoFormEl" [formGroup]="bancoForm" (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-md-12 mb-3">
          <label for="banco" class="form-label fw-bold">Nombre del Banco *</label>
          <input
            type="text"
            id="banco"
            formControlName="banco"
            class="form-control"
            [class.is-invalid]="isInvalid('banco')"
            placeholder="Ej: Banco de México">
          <div class="invalid-feedback">El nombre del banco es obligatorio (máx 100 caracteres).</div>
        </div>
      </div>
    </form>

    <div slot="footer" class="d-flex justify-content-end gap-2">
      <a routerLink="/catalogos/bancos" class="btn btn-outline-secondary">
        <i class="fa fa-times me-1"></i> Cancelar
      </a>
      <button type="submit" form="bancoFormEl" class="btn btn-primary" [disabled]="bancoForm.invalid || isLoading()">
        @if (isLoading()) {
          <span class="spinner-border spinner-border-sm me-1"></span>
        }
        <i class="fa fa-save me-1"></i> {{ isEditMode() ? 'Guardar Cambios' : 'Registrar Banco' }}
      </button>
    </div>

  </app-card>
</div>
