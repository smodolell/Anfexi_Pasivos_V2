<header class="topbar">
  <nav class="navbar top-navbar navbar-expand-md navbar-dark">

    <!-- Logo -->
    <div class="navbar-header">
      <a class="navbar-brand" href="javascript:void(0)">
        <b><img src="assets/images/logo-light-icon.png" alt="homepage" class="light-logo" /></b>
        <span [class.d-none]="isMiniSidebar()">
          <span class="font-bold">Profuturo</span>&nbsp;Pasivos
        </span>
      </a>
    </div>

    <div class="navbar-collapse">

      <!-- Toggles de sidebar -->
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link nav-toggler d-block d-md-none waves-effect waves-dark"
             href="javascript:void(0)"
             (click)="toggleMobileNav.emit(); $event.preventDefault()">
            <i class="ti-menu"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link sidebartoggler d-none d-lg-block d-md-block waves-effect waves-dark"
             href="javascript:void(0)"
             (click)="toggleSidebar.emit(); $event.preventDefault()">
            <i class="icon-menu"></i>
          </a>
        </li>
      </ul>

      <!-- Perfil de usuario -->
      <ul class="navbar-nav my-lg-0">
        <li class="nav-item dropdown u-pro">
          <a
            class="nav-link dropdown-toggle waves-effect waves-dark profile-pic"
            href=""
            data-bs-toggle="dropdown"
            aria-haspopup="true"
            aria-expanded="false"
          >
            <img src="assets/images/users/1.jpg" alt="Usuario" class="">
            <span class="hidden-md-down">
              &nbsp;{{ currentUser?.nombreCompleto }}<i class="fa fa-angle-down"></i>
            </span>
            <img src="assets/images/LogoAnfexiP.png" alt="Anfexi" class="ms-2">
          </a>
          <div class="dropdown-menu dropdown-menu-end animated flipInY">
            <a routerLink="/admin/profile" class="dropdown-item">
              <i class="ti-user"></i> Mi Perfil
            </a>
            <a href="javascript:void(0)" class="dropdown-item" (click)="logout()">
              <i class="fa fa-power-off"></i> Salir
            </a>
          </div>
        </li>
      </ul>

    </div>
  </nav>
</header>

<!-- ── Modal de confirmación de logout ──────────────────────── -->
@if (showLogoutModal()) {
  <div
    class="modal fade show d-block"
    tabindex="-1"
    aria-labelledby="logoutModalLabel"
    aria-modal="true"
    role="dialog"
    (keydown)="onModalKeydown($event)"
  >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="logoutModalLabel">
            <i class="fa fa-power-off text-warning me-2"></i>
            Confirmar Cierre de Sesión
          </h5>
          <button type="button" class="btn-close" (click)="cancelLogout()" aria-label="Cerrar modal"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex align-items-center">
            <i class="fa fa-question-circle text-warning me-3" style="font-size: 2rem"></i>
            <div>
              <p class="mb-1">¿Estás seguro de que quieres cerrar sesión?</p>
              <small class="text-muted">Se cerrará tu sesión actual y tendrás que volver a iniciar sesión.</small>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="cancelLogout()" autofocus>
            <i class="fa fa-times me-1"></i> Cancelar
          </button>
          <button type="button" class="btn btn-danger" (click)="confirmLogout()">
            <i class="fa fa-power-off me-1"></i> Cerrar Sesión
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-backdrop fade show" (click)="cancelLogout()"></div>
}
